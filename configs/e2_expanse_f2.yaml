# E2 control: same sweep on Aya Expanse 8B (full attention everywhere) with Tiny Aya's preamble injected.
name: e2_expanse_f2
model: aya-expanse-8b
family: expanse
prompt_files: [data/prompts/harmful_en.jsonl, data/prompts/rule_probes.jsonl, data/prompts/capability.jsonl]
split: eval
conditions: [P-default-injected, P-nosys]
distances: [500, 1000, 2000, 3000, 3500, 3900, 4100, 4500, 5000, 6000, 7000, 7400]
fillers: [F2]
signals: [first_token, generate]
judge: harm
backend: vllm
dtype: bfloat16
n_per_bucket: 100
